name: web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/club-sites/**", "apps/www/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "apps/club-sites/**", "apps/www/**", ".github/workflows/web.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, club-sites, www]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
